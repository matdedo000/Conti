<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1E3A5F">
<title>Conti</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#EDF1F0;--card:#fff;--ink:#14262B;--mut:#5F7378;--line:#D5DEDC;--in:#0E7A6B;--out:#B23A5E;--acc:#1E3A5F;--onacc:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0F1A1D;--card:#17262A;--ink:#E6EFEE;--mut:#8DA3A7;--line:#263A3F;--in:#4CC2AE;--out:#EE7C9B;--acc:#8DB4E8;--onacc:#0F1A1D}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;padding:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav{display:flex;align-items:center;gap:4px}
.nav button{border:0;background:var(--card);width:40px;height:40px;border-radius:50%;font-size:18px}
h1{font:600 22px/1.1 Georgia,"Iowan Old Style",serif;margin:0;min-width:150px;text-align:center;text-transform:capitalize}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--onacc)}
.sum{margin:16px 0 8px}
.bal{font:600 40px/1.1 Georgia,"Iowan Old Style",serif}
.bal small{display:block;font:14px sans-serif;color:var(--mut)}
.two{display:flex;gap:10px;margin-top:12px}
.two div{flex:1;background:var(--card);border-radius:12px;padding:10px 12px}
.two b{display:block;font-size:18px}
.in{color:var(--in)}.out{color:var(--out)}
.card{background:var(--card);border-radius:14px;padding:14px;margin-top:14px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;border:1px solid var(--line);background:none;border-radius:999px;padding:6px 4px;font-size:14px;color:var(--mut)}
.tabs button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
svg{width:100%;height:auto;display:block}
.pie{max-width:220px;margin:0 auto}
.leg{list-style:none;margin:12px 0 0;padding:0}
.leg li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:3px;flex:none}
.leg .n{flex:1}.leg .p{color:var(--mut);font-size:13px}
.empty{color:var(--mut);text-align:center;margin:20px 0}
.sw{display:flex;gap:14px;justify-content:center;font-size:13px;color:var(--mut);margin-top:6px}
h2{font-size:15px;margin:0 0 6px;color:var(--mut);font-weight:600}
.tx{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0}
.tx .d{width:42px;color:var(--mut);font-size:13px}
.tx .m{flex:1;min-width:0}.tx .m span{display:block;color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--acc);color:var(--onacc);font-size:32px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
dialog{margin:auto auto 0;width:100%;max-width:560px;border:0;border-radius:20px 20px 0 0;background:var(--card);color:var(--ink);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.type{display:flex;gap:8px}
.type button{flex:1;padding:10px;border:1px solid var(--line);background:none;border-radius:10px}
.type button[aria-pressed=true]{color:#fff;border-color:transparent}
.type .o[aria-pressed=true]{background:var(--out)}.type .i[aria-pressed=true]{background:var(--in)}
.acts{display:flex;gap:8px;margin-top:16px}
.acts button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:none}
.acts .s{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
.acts .x{color:var(--out)}
.acc{display:flex;justify-content:space-between;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;text-align:left}
.lnk{background:none;border:0;color:var(--acc);padding:10px 0 0;font-weight:600}
.foot{margin-top:22px;text-align:center;font-size:13px;color:var(--mut)}
.foot button{background:none;border:0;color:var(--acc);text-decoration:underline;padding:6px 8px}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;display:none;z-index:9}
</style>
</head>
<body>
<main>
  <section class="card" style="margin-top:0"><h2>Saldo totale</h2><div class="bal" id="tot"></div><div id="accs"></div><button class="lnk" id="addAcc">+ Aggiungi conto</button></section>
  <div class="top" style="margin-top:14px">
    <div class="nav"><button id="prev" aria-label="Periodo precedente">‹</button><h1 id="title"></h1><button id="next" aria-label="Periodo successivo">›</button></div>
    <div class="seg" role="group" aria-label="Vista"><button id="vm" aria-pressed="true">Mese</button><button id="vy" aria-pressed="false">Anno</button></div>
  </div>
  <select id="accf" aria-label="Filtra per conto" style="margin-top:12px"></select>
  <section class="sum">
    <div class="bal" id="bal"></div>
    <div class="two"><div><span class="in">Entrate</span><b id="tin"></b></div><div><span class="out">Uscite</span><b id="tout"></b></div></div>
  </section>
  <section class="card">
    <div class="tabs" role="group" aria-label="Grafico">
      <button data-ch="out">Spese</button><button data-ch="in">Entrate</button><button data-ch="bars">Colonne</button>
    </div>
    <div id="chart"></div>
  </section>
  <section class="card"><h2>Movimenti</h2><div id="list"></div></section>
  <div class="foot">I dati restano solo su questo dispositivo.<br><button id="exp">Esporta backup</button><button id="imp">Importa backup</button><input type="file" id="file" accept="application/json" hidden></div>
</main>
<button class="fab" id="add" aria-label="Aggiungi movimento">+</button>
<div id="toast" role="status"></div>

<dialog id="dlg">
  <div class="type" role="group" aria-label="Tipo"><button class="o" id="tO" type="button">Uscita</button><button class="i" id="tI" type="button">Entrata</button></div>
  <label for="amt">Importo (€)</label><input id="amt" inputmode="decimal" placeholder="0,00" autocomplete="off">
  <label for="acc">Conto</label><select id="acc"></select>
  <label for="cat">Categoria</label><select id="cat"></select>
  <label for="dat">Data</label><input id="dat" type="date">
  <label for="note">Nota (facoltativa)</label><input id="note" maxlength="80" autocomplete="off">
  <div class="acts"><button class="x" id="del" type="button">Elimina</button><button id="can" type="button">Annulla</button><button class="s" id="sav" type="button">Salva</button></div>
</dialog>
<dialog id="dlgA"><h2 id="aT">Nuovo conto</h2>
  <label for="aN">Nome del conto</label><input id="aN" maxlength="30" placeholder="Es. Conto corrente" autocomplete="off">
  <label for="aB">Saldo iniziale (€)</label><input id="aB" inputmode="text" placeholder="0,00" autocomplete="off">
  <div class="acts"><button class="x" id="aD" type="button">Elimina</button><button id="aC" type="button">Annulla</button><button class="s" id="aS" type="button">Salva</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s),K='conti-v2';
const DEF={out:['Cibo','Viaggi','Vestiti','Svago','Acquisti','Casa','Trasporti','Salute','Investimenti','Altro'],in:['Stipendio','Investimenti','Regali','Altro']};
const PAL=['#1E3A5F','#B23A5E','#0E7A6B','#D9A441','#6B5BA8','#3E9BC4','#8C5A3C','#7FA650','#C4553B','#7C8B90','#A0537F','#4F7F8C'];
const fmt=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'});
let S={tx:[],acc:[],cats:{out:[],in:[]}};
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
S.cats=S.cats||{out:[],in:[]};S.acc=S.acc||[];
const now=new Date();
let V={mode:'m',y:now.getFullYear(),m:now.getMonth(),ch:'out',acc:'all'},E=null,EA=null,T='out';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cats=t=>[...DEF[t],...(S.cats[t]||[])];
const col=(t,c)=>PAL[Math.max(0,cats(t).indexOf(c))%PAL.length];
const p2=n=>String(n).padStart(2,'0');
const today=()=>`${now.getFullYear()}-${p2(now.getMonth()+1)}-${p2(now.getDate())}`;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Salvataggio non riuscito: archiviazione bloccata dal browser')}}
const prefix=()=>V.mode==='m'?`${V.y}-${p2(V.m+1)}`:`${V.y}`;
const sel=()=>S.tx.filter(x=>x.d.startsWith(prefix())&&(V.acc==='all'||x.k===V.acc));
const sum=(a,t)=>a.filter(x=>x.t===t).reduce((s,x)=>s+x.a,0);
const parse=s=>{s=String(s).trim().replace(/\s/g,'');return parseFloat(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s)};
const accName=k=>(S.acc.find(a=>a.id===k)||{name:'Conto eliminato'}).name;
const accBal=a=>a.init+S.tx.filter(x=>x.k===a.id).reduce((s,x)=>s+(x.t==='in'?x.a:-x.a),0);
function renderAcc(){
  if(V.acc!=='all'&&!S.acc.some(a=>a.id===V.acc))V.acc='all';
  const t=S.acc.reduce((s,a)=>s+accBal(a),0);
  $('#tot').innerHTML=`<span class="${t<0?'out':''}">${fmt.format(t)}</span>`;
  $('#accs').innerHTML=S.acc.length?S.acc.map(a=>{const b=accBal(a);return `<button class="acc" data-id="${a.id}"><span>${esc(a.name)}</span><b class="${b<0?'out':''}">${fmt.format(b)}</b></button>`}).join(''):'<p class="empty">Aggiungi il tuo primo conto con il saldo iniziale.</p>';
  const f=$('#accf');f.innerHTML='<option value="all">Tutti i conti</option>'+S.acc.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('');f.value=V.acc;f.style.display=S.acc.length>1?'':'none';
}

function pie(t,a){
  const by={};a.filter(x=>x.t===t).forEach(x=>by[x.c]=(by[x.c]||0)+x.a);
  const list=Object.entries(by).map(([k,v])=>({k,v})).sort((x,y)=>y.v-x.v),tot=list.reduce((s,x)=>s+x.v,0);
  if(!tot)return '<p class="empty">Nessun dato in questo periodo. Tocca + per aggiungere un movimento.</p>';
  const C=2*Math.PI*57;let cum=0,c='';
  list.forEach(x=>{const f=x.v/tot;c+=`<circle cx="80" cy="80" r="57" fill="none" stroke="${col(t,x.k)}" stroke-width="26" stroke-dasharray="${f*C} ${C}" stroke-dashoffset="${-cum*C}" transform="rotate(-90 80 80)"/>`;cum+=f});
  const svg=`<svg class="pie" viewBox="0 0 160 160" role="img" aria-label="Ripartizione per categoria">${c}<text x="80" y="78" text-anchor="middle" font-size="11" fill="var(--mut)">Totale</text><text x="80" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="var(--ink)">${fmt.format(tot)}</text></svg>`;
  return svg+'<ul class="leg">'+list.map(x=>`<li><span class="dot" style="background:${col(t,x.k)}"></span><span class="n">${esc(x.k)}</span><span class="p">${(x.v/tot*100).toFixed(0)}%</span><b>${fmt.format(x.v)}</b></li>`).join('')+'</ul>';
}
function bars(a){
  let rows=[];
  if(V.mode==='m'){const n=new Date(V.y,V.m+1,0).getDate();for(let d=1;d<=n;d++)rows.push({l:d,show:d===1||d%5===0,i:0,o:0})}
  else for(let m=0;m<12;m++)rows.push({l:new Date(2000,m,1).toLocaleDateString('it-IT',{month:'short'}),show:true,i:0,o:0});
  a.forEach(x=>{const k=V.mode==='m'?+x.d.slice(8,10)-1:+x.d.slice(5,7)-1;rows[k][x.t==='in'?'i':'o']+=x.a});
  if(!a.length)return '<p class="empty">Nessun dato in questo periodo. Tocca + per aggiungere un movimento.</p>';
  const W=340,H=170,pt=10,pb=22,bh=H-pt-pb,mx=Math.max(1,...rows.flatMap(r=>[r.i,r.o])),g=W/rows.length,bw=Math.max(2,Math.min(12,g/2-1));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entrate e uscite nel tempo">`;
  rows.forEach((r,k)=>{const x=k*g+g/2,hi=r.i/mx*bh,ho=r.o/mx*bh;
    s+=`<rect x="${x-bw-.5}" y="${pt+bh-hi}" width="${bw}" height="${hi}" rx="1.5" fill="var(--in)"/><rect x="${x+.5}" y="${pt+bh-ho}" width="${bw}" height="${ho}" rx="1.5" fill="var(--out)"/>`;
    if(r.show)s+=`<text x="${x}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--mut)">${r.l}</text>`});
  s+=`<line x1="0" x2="${W}" y1="${pt+bh}" y2="${pt+bh}" stroke="var(--line)"/></svg><div class="sw"><span class="in">■ Entrate</span><span class="out">■ Uscite</span><span>Max ${fmt.format(mx)}</span></div>`;
  return s;
}
function render(){renderAcc();
  $('#title').textContent=V.mode==='m'?new Date(V.y,V.m,1).toLocaleDateString('it-IT',{month:'long',year:'numeric'}):V.y;
  $('#vm').setAttribute('aria-pressed',V.mode==='m');$('#vy').setAttribute('aria-pressed',V.mode==='y');
  const a=sel(),i=sum(a,'in'),o=sum(a,'out'),b=i-o;
  $('#bal').innerHTML=`<small>Saldo ${V.mode==='m'?'del mese':'dell\'anno'}</small><span class="${b<0?'out':'in'}">${fmt.format(b)}</span>`;
  $('#tin').textContent=fmt.format(i);$('#tout').textContent=fmt.format(o);
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.ch===V.ch));
  $('#chart').innerHTML=V.ch==='bars'?bars(a):pie(V.ch,a);
  const L=[...a].sort((x,y)=>y.d.localeCompare(x.d)||y.id-x.id).slice(0,100);
  $('#list').innerHTML=L.length?L.map(x=>`<button class="tx" data-id="${x.id}"><span class="d">${x.d.slice(8)}/${x.d.slice(5,7)}</span><span class="dot" style="background:${col(x.t,x.c)}"></span><span class="m">${esc(x.c)}<span>${esc(accName(x.k))}${x.n?' · '+esc(x.n):''}</span></span><b class="${x.t}">${x.t==='in'?'+':'−'}${fmt.format(x.a)}</b></button>`).join(''):'<p class="empty">Ancora nessun movimento.</p>';
}
function shift(n){if(V.mode==='m'){V.m+=n;if(V.m<0){V.m=11;V.y--}if(V.m>11){V.m=0;V.y++}}else V.y+=n;render()}
function fillCats(sel){const s=$('#cat');s.innerHTML=cats(T).map(c=>`<option>${esc(c)}</option>`).join('')+'<option value="__new">+ Nuova categoria…</option>';if(sel)s.value=sel}
function setT(t,keep){T=t;$('#tO').setAttribute('aria-pressed',t==='out');$('#tI').setAttribute('aria-pressed',t==='in');fillCats(keep)}
function openForm(x){
  if(!S.acc.length){toast('Prima crea un conto con il saldo iniziale');return openAcc()}
  E=x||null;setT(x?x.t:'out',x&&x.c);const dk=x?x.k:(V.acc!=='all'?V.acc:S.last);
  $('#acc').innerHTML=S.acc.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('');$('#acc').value=S.acc.some(a=>a.id===dk)?dk:S.acc[0].id;
  $('#amt').value=x?String(x.a).replace('.',','):'';$('#dat').value=x?x.d:today();$('#note').value=x?x.n||'':'';
  $('#del').style.display=x?'':'none';$('#dlg').showModal();if(!x)$('#amt').focus();
}
$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);
$('#vm').onclick=()=>{V.mode='m';render()};$('#vy').onclick=()=>{V.mode='y';render()};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{V.ch=b.dataset.ch;render()});
$('#add').onclick=()=>openForm();
$('#list').onclick=e=>{const b=e.target.closest('.tx');if(b)openForm(S.tx.find(x=>x.id==b.dataset.id))};
$('#tO').onclick=()=>setT('out');$('#tI').onclick=()=>setT('in');
$('#cat').onchange=e=>{if(e.target.value==='__new'){const n=(prompt('Nome della nuova categoria')||'').trim().slice(0,24);
  if(n&&!cats(T).some(c=>c.toLowerCase()===n.toLowerCase())){S.cats[T].push(n);save()}fillCats(n||cats(T)[0])}};
$('#can').onclick=()=>$('#dlg').close();
$('#del').onclick=()=>{if(confirm('Eliminare questo movimento?')){S.tx=S.tx.filter(x=>x!==E);save();$('#dlg').close();render()}};
$('#sav').onclick=()=>{
  const a=parse($('#amt').value);
  if(!(a>0))return toast('Inserisci un importo maggiore di zero');
  if(!$('#dat').value)return toast('Scegli una data');
  const r={t:T,k:+$('#acc').value,a:Math.round(a*100)/100,c:$('#cat').value,d:$('#dat').value,n:$('#note').value.trim()};
  S.last=r.k;if(E)Object.assign(E,r);else S.tx.push({id:Date.now(),...r});
  save();$('#dlg').close();V.y=+r.d.slice(0,4);V.m=+r.d.slice(5,7)-1;render();
};
$('#exp').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download=`conti-backup-${today()}.json`;l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.tx))throw 0;
  if(confirm(`Sostituire i dati attuali con il backup (${d.tx.length} movimenti)?`)){S={tx:d.tx,acc:d.acc||[],last:d.last,cats:d.cats||{out:[],in:[]}};save();render();toast('Backup importato')}}catch(x){toast('File di backup non valido')}e.target.value=''};
function openAcc(a){EA=a||null;$('#aT').textContent=a?'Modifica conto':'Nuovo conto';$('#aN').value=a?a.name:'';$('#aB').value=a?String(a.init).replace('.',','):'';$('#aD').style.display=a?'':'none';$('#dlgA').showModal();$('#aN').focus()}
$('#addAcc').onclick=()=>openAcc();
$('#accs').onclick=e=>{const b=e.target.closest('.acc');if(b)openAcc(S.acc.find(x=>x.id==b.dataset.id))};
$('#accf').onchange=e=>{V.acc=e.target.value==='all'?'all':+e.target.value;render()};
$('#aC').onclick=()=>$('#dlgA').close();
$('#aS').onclick=()=>{const n=$('#aN').value.trim(),b=$('#aB').value.trim()===''?0:parse($('#aB').value);
  if(!n)return toast('Scrivi il nome del conto');if(isNaN(b))return toast('Saldo iniziale non valido');
  const v=Math.round(b*100)/100;if(EA){EA.name=n;EA.init=v}else S.acc.push({id:Date.now(),name:n,init:v});
  save();$('#dlgA').close();render()};
$('#aD').onclick=()=>{if(S.tx.some(x=>x.k===EA.id))return toast('Il conto ha dei movimenti: non si può eliminare');
  if(confirm('Eliminare questo conto?')){S.acc=S.acc.filter(x=>x!==EA);save();$('#dlgA').close();render()}};
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
